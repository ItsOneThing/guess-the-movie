<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看图猜电影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --milk: #F3EFFF;          /* 奶紫底色 */
    --ink: #2E2453;           /* 深靛蓝：文字 / 主按钮 */
    --ink-deep: #1B1436;      /* 按钮"厚度" */
    --dim: #7A7398;
    --line: rgba(46, 36, 83, .14);
    --curtain: #E8607B;       /* 幕布玫瑰红 */
    --screen: #1E1738;        /* 银幕深色 */
    --display: "ZCOOL KuaiLe", "YouYuan", "幼圆", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  /* 意大利语：换成同样圆润可爱、并且带重音字母的拉丁字体 */
  html[lang="it"] {
    --display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    --body: "Noto Sans SC", "Nunito", system-ui, sans-serif;
  }
  html[lang="it"] .masthead h1,
  html[lang="it"] .tk .nm,
  html[lang="it"] .ticket-main h2,
  html[lang="it"] .ticket-stub strong,
  html[lang="it"] .end-title { font-weight: 600; }
  html[lang="it"] .masthead h1 { font-size: clamp(40px, 9vw, 74px); letter-spacing: -.01em; }
  html[lang="it"] .end-title { font-size: clamp(40px, 9vw, 68px); }
  html[lang="it"] .tk .nm { font-size: 21px; }
  html[lang="it"] .tk-wrap.on::after { font-size: 11px; }
  html[lang="it"] .btn { letter-spacing: .01em; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    background-color: var(--milk);
    background-image:
      radial-gradient(60% 38% at 0% 0%, rgba(255, 143, 163, .25), transparent 70%),
      radial-gradient(50% 36% at 100% 6%, rgba(120, 190, 255, .28), transparent 70%),
      radial-gradient(rgba(46, 36, 83, .075) 1.3px, transparent 1.8px);
    background-size: auto, auto, 22px 22px;
    background-repeat: no-repeat, no-repeat, repeat;
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
  }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .screen { flex: 1 0 auto; width: 100%; max-width: 980px; margin: 0 auto; padding: 24px 20px 36px; }

  /* ---------- 语言切换 ---------- */
  .langbar {
    flex-shrink: 0; width: 100%; max-width: 980px; margin: 0 auto;
    padding: 18px 20px 0; display: flex; justify-content: flex-end;
  }
  .lang {
    display: inline-flex; gap: 2px; padding: 4px;
    background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
    box-shadow: 0 3px 0 rgba(46, 36, 83, .12);
  }
  .lang button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 5px 16px; border: 0; border-radius: 999px;
    background: transparent; color: var(--dim); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .lang button:hover:not([aria-pressed="true"]) { color: var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- buttons：厚厚的、按下去会陷进去 ---------- */
  .btn {
    font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .04em;
    padding: 14px 40px; border: 0; border-radius: 999px;
    background: var(--ink); color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 var(--ink-deep), 0 14px 22px rgba(46, 36, 83, .22);
    transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink-deep), 0 18px 26px rgba(46, 36, 83, .24); }
  .btn:active { transform: translateY(4px);  box-shadow: 0 1px 0 var(--ink-deep), 0 4px 8px rgba(46, 36, 83, .2); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--ink-deep); }
  .btn.ghost {
    background: #fff; color: var(--ink); border: 1.5px solid var(--line);
    font-size: 15px; font-weight: 500; letter-spacing: 0; padding: 8px 20px;
    box-shadow: 0 3px 0 rgba(46, 36, 83, .14);
  }
  .btn.ghost:hover  { box-shadow: 0 5px 0 rgba(46, 36, 83, .14); }
  .btn.ghost:active { box-shadow: 0 0 0 rgba(46, 36, 83, .14); }
    a.btn { display: inline-block; text-decoration: none; }

  /* ---------- pick screen ---------- */
  .masthead { margin-bottom: 38px; }
  .masthead h1 {
    margin: 0 0 14px;
    font-family: var(--display); font-weight: 400;
    font-size: clamp(46px, 10vw, 84px); line-height: 1.1;
  }
  .masthead .hl {
    padding: 0 .1em;
    background: linear-gradient(transparent 62%, #FFD37A 62% 92%, transparent 92%);
  }
  .masthead p { margin: 0; color: var(--dim); font-size: 17px; max-width: 30em; }

  .tickets {
    list-style: none; margin: 0; padding: 12px 0 0;
    display: grid; gap: 26px 20px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .tk-wrap {
    position: relative;
    filter: drop-shadow(0 12px 14px rgba(46, 36, 83, .18));
    transition: transform .2s cubic-bezier(.3, 1.4, .5, 1);
  }
  .tk-wrap:hover { transform: translateY(-4px); }
  .tk-wrap.on { transform: translateY(-10px) rotate(-2deg); }
  .tk-wrap:has(.tk:focus-visible) { outline: 3px solid var(--ink); outline-offset: 5px; border-radius: 8px; }
  .tk-wrap.on::after {
    content: attr(data-stamp);
    position: absolute; top: 14px; right: 16px;
    width: 48px; height: 48px; display: grid; place-items: center;
    border: 2px dashed var(--ink); border-radius: 50%;
    color: var(--ink); font-size: 14px; font-weight: 700;
    transform: rotate(12deg); pointer-events: none;
  }
  .tk {
    appearance: none; border: 0; width: 100%; min-height: 156px;
    padding: 16px 22px 14px; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    font: inherit; color: var(--ink);
    background: linear-gradient(155deg, rgba(255, 255, 255, .45), transparent 55%), var(--paper);
    -webkit-mask:
      radial-gradient(circle 11px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle 11px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
            mask:
      radial-gradient(circle 11px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle 11px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  }
  .tk:focus-visible { outline: none; }
  .tk .emo {
    width: 48px; height: 48px; display: grid; place-items: center;
    border-radius: 50%; font-size: 27px; line-height: 1;
    background: rgba(255, 255, 255, .72);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .95);
  }
  .tk .nm { font-family: var(--display); font-size: 24px; line-height: 1.25; overflow-wrap: break-word; }
  .tk .ct { font-size: 13px; opacity: .7; padding-top: 8px; border-top: 2px dashed rgba(46, 36, 83, .32); }

  .pick-bar { margin-top: 46px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  #pickStatus { color: var(--dim); font-size: 16px; }
  /* ---------- 转盘：随机抽两个主题 ---------- */
.spin-card {
  position: relative; width: min(440px, 100%); max-height: 100%; overflow: auto;
  padding: 28px 24px 26px; text-align: center;
  background: #fff; border-radius: 28px; box-shadow: 0 24px 50px rgba(0, 0, 0, .35);
}
.spin-card h2 { margin: 0 36px 22px; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.2; }
html[lang="it"] .spin-card h2 { font-weight: 600; font-size: 25px; }
.spin-x {
  position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
  border: 1.5px solid var(--line); border-radius: 50%; background: #fff;
  color: var(--ink); font: inherit; font-size: 16px; cursor: pointer;
}
.wheel-wrap { position: relative; width: min(320px, 74vw); aspect-ratio: 1; margin: 0 auto; }
.wheel { display: block; width: 100%; height: 100%; border-radius: 50%; filter: drop-shadow(0 8px 0 rgba(46, 36, 83, .14)); }
.ptr {
  position: absolute; left: 50%; top: -12px; z-index: 2; width: 0; height: 0; transform: translateX(-50%);
  border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 28px solid var(--ink);
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .18));
}
.hub {
  position: absolute; left: 50%; top: 50%; z-index: 2; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  display: grid; place-items: center; border-radius: 50%; background: #fff;
  border: 4px solid var(--ink); font-size: 22px; line-height: 1;
}
.spin-res { list-style: none; margin: 26px 0 22px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spin-res li {
  min-height: 52px; display: grid; place-items: center; padding: 8px 10px;
  border: 2px dashed rgba(46, 36, 83, .25); border-radius: 14px;
  color: rgba(46, 36, 83, .35); font-family: var(--display); font-size: 17px; line-height: 1.25; overflow-wrap: break-word;
}
.spin-res li.got { background: var(--paper); border: 2px solid transparent; color: var(--ink); }
.spin-res li.got.new { animation: chip .45s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes chip { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.spin-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* ---------- 抢答器：房间码 + 加入的人 + 抢答顺序 + 计分 ---------- */
.buzz {
  margin-left: auto; display: flex; align-items: center; gap: 16px;
  padding: 12px 20px 12px 12px; background: #fff;
  border: 1.5px dashed rgba(46, 36, 83, .28); border-radius: 22px;
  box-shadow: 0 3px 0 rgba(46, 36, 83, .1);
}
.qr {
  flex: none; display: grid; place-items: center; width: 96px; height: 96px; padding: 7px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 14px;
  cursor: pointer; transition: transform .15s;
}
.qr:hover { transform: translateY(-2px) rotate(-2deg); }
.qr canvas, .qr svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.buzz .code { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.buzz .code-t { font-size: 14px; color: var(--dim); }
.buzz .code-v {
  font-family: var(--display); font-size: 32px; line-height: 1.2; color: var(--ink);
  letter-spacing: .04em;
}
.buzz .code-hint { font-size: 12px; color: var(--dim); }

  /* ---------- 抢答控制台弹窗 ---------- */
  .console-card {
    position: relative; width: min(640px, 100%); max-height: 88vh; overflow: auto;
    padding: 30px 26px 26px; text-align: left;
    background: #fff; border-radius: 28px; box-shadow: 0 24px 50px rgba(0, 0, 0, .35);
  }
  .console-card h2 { margin: 0 36px 4px; font-family: var(--display); font-weight: 400; font-size: 28px; }
  html[lang="it"] .console-card h2 { font-weight: 600; font-size: 24px; }
  .console-room { display: flex; align-items: center; gap: 18px; margin: 18px 0 22px; padding: 16px 18px; background: var(--milk); border-radius: 18px; }
  .console-room .qr { border: 2px solid var(--ink); }
  .console-room .rc { flex: 1; min-width: 0; }
  .console-room .rc-label { font-size: 13px; color: var(--dim); }
  .console-room .rc-code { font-family: var(--display); font-size: 40px; letter-spacing: .06em; line-height: 1.15; }
  .console-room .rc-url { font-size: 12px; color: var(--dim); word-break: break-all; }
  .console-status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); margin-bottom: 18px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #C9C2E6; flex: none; }
  .dot.live { background: #38C172; }
  .dot.err { background: var(--curtain); }
  .console-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .console-actions .btn { padding: 10px 22px; font-size: 15px; }
  .console-sec-t { font-size: 14px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
  .buzz-order { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 8px; }
  .buzz-order li {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--milk); border-radius: 12px; font-size: 15px;
  }
  .buzz-order .rk {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center;
    border-radius: 50%; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px;
  }
  .buzz-order li:first-child .rk { background: #FFB020; }
  .buzz-order .nm { flex: 1; font-weight: 500; }
  .buzz-order .tm { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty-hint { color: var(--dim); font-size: 14px; padding: 10px 2px 20px; }
  .board { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .board li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--milk); border-radius: 12px;
  }
  .board .nm { flex: 1; font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
  .board .sc { font-family: var(--display); font-size: 20px; min-width: 2.4em; text-align: center; }
  .board .mini { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .board .mini:active { transform: translateY(1px); }
  .board .rm { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--dim); font-size: 15px; cursor: pointer; }
  .board .rm:hover { color: var(--curtain); }
  .setup-note {
    margin: 0 0 20px; padding: 14px 16px; border-radius: 14px;
    background: #FFF3E0; border: 1.5px dashed #E8A33D; font-size: 13px; line-height: 1.7;
  }
  .setup-note code { background: rgba(46,36,83,.08); padding: 1px 5px; border-radius: 5px; }

  /* ---------- play screen ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .progress { display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 15px; }
  .frames { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; align-items: center; }
  .frames li { width: 24px; height: 10px; border-radius: 999px; background: rgba(46, 36, 83, .14); transition: background .2s, width .2s; }
  .frames li.done { background: var(--curtain); }
  .frames li.now  { background: var(--ink); width: 40px; }

  /* 剧院：幕布 + 银幕。银幕比例固定，图片再怎么不一样大也不会把页面撑得跳来跳去 */
  .theater {
    --ar: 1.7778;                                   /* 16:9 */
    width: min(100%, calc(62vh * var(--ar)));
    width: min(100%, calc(62dvh * var(--ar)));
    margin: 0 auto;
  }
  .valance {
    height: 30px; margin-bottom: 6px; border-radius: 12px 12px 0 0;
    background:
      linear-gradient(var(--curtain), var(--curtain)) top / 100% 12px no-repeat,
      radial-gradient(circle 17px at 50% 12px, var(--curtain) 97%, #0000) 0 0 / 36px 100% repeat-x;
    filter: drop-shadow(0 4px 0 rgba(46, 36, 83, .14));
  }
  .stage {
    position: relative; display: grid; place-items: center; overflow: hidden;
    aspect-ratio: var(--ar); width: 100%;
    border: 5px solid #fff; border-radius: 22px; background: var(--screen);
    box-shadow: 0 22px 40px rgba(46, 36, 83, .25);
  }
  /* 模糊背景：把同一张图铺满并虚化，前景图完整显示（不裁切），空白处自然被"氛围光"填满 */
  .stage .bg {
    position: absolute; inset: -40px;
    background-size: cover; background-position: center;
    filter: blur(28px) saturate(1.25) brightness(.68);
    opacity: 0; transition: opacity .4s;
  }
  .stage .bg.ready { opacity: 1; }
  .stage img {
    position: relative; z-index: 1;
    width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .35s;
  }
  .stage img.ready { opacity: 1; }
  .stage .msg { position: absolute; z-index: 2; padding: 20px; color: #D9D3FF; text-align: center; }
    .stage .count {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    font-family: var(--display); font-size: clamp(96px, 24vw, 190px); line-height: 1; color: #fff;
    text-shadow: 0 6px 0 rgba(0, 0, 0, .28);
  }
  .stage .count span { animation: pop .9s ease-out both; }
  @keyframes pop {
    from { transform: scale(.4); opacity: 0; }
    30%  { transform: scale(1.12); opacity: 1; }
    to   { transform: scale(1); opacity: .9; }
  }
  .controls { margin-top: 30px; display: flex; justify-content: center; }

  /* ---------- reveal ticket ---------- */
  .reveal {
    position: fixed; inset: 0; z-index: 10; padding: 20px;
    display: grid; place-items: center;
    background: rgba(30, 23, 56, .62);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  }
  .reveal-box { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .ticket-wrap {
    position: relative;
    width: 100%; transform: rotate(-1deg); transform-origin: 50% 0;
    filter: drop-shadow(0 20px 28px rgba(0, 0, 0, .4));
    animation: print .55s cubic-bezier(.2, .9, .3, 1.15) both;
  }
  @keyframes print {
    from { transform: translateY(-40px) rotate(-5deg) scale(.95); opacity: 0; }
    to   { transform: rotate(-1deg); opacity: 1; }
  }
  .ticket {
    --stub: 136px; --r: 13px;
    display: grid; grid-template-columns: 1fr var(--stub);
    background: linear-gradient(155deg, rgba(255, 255, 255, .5), transparent 55%), var(--paper);
    color: var(--ink);
    -webkit-mask:
      radial-gradient(circle var(--r) at calc(100% - var(--stub)) 0, #0000 97%, #000) top / 100% 51% no-repeat,
      radial-gradient(circle var(--r) at calc(100% - var(--stub)) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
            mask:
      radial-gradient(circle var(--r) at calc(100% - var(--stub)) 0, #0000 97%, #000) top / 100% 51% no-repeat,
      radial-gradient(circle var(--r) at calc(100% - var(--stub)) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
  }
  .ticket-main { padding: 28px 22px 28px 30px; min-height: 168px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .ticket-main .from { margin: 0; font-size: 14px; opacity: .78; }
  .ticket-main h2 {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(26px, 5.4vw, 38px); line-height: 1.22; text-wrap: balance; overflow-wrap: break-word;
  }
  .ticket-stub {
    border-left: 2px dashed rgba(46, 36, 83, .4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px;
  }
  .ticket-stub small { font-size: 13px; opacity: .78; }
  .ticket-stub strong { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; }
  .barcode {
    width: 74%; height: 16px; margin-top: 8px; opacity: .55;
    background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px);
  }

  /* 揭晓时的小烟花 */
  .spark {
    position: absolute; left: 50%; top: 50%;
    font-style: normal; font-size: 22px; line-height: 1; pointer-events: none;
    animation: spark .95s ease-out .25s both;
  }
  @keyframes spark {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); }
  }

  /* ---------- end screen ---------- */
  .end-title { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: clamp(46px, 10vw, 76px); line-height: 1.1; }
  .end-sub { margin: 0 0 30px; color: var(--dim); }
  .recap { list-style: none; margin: 0 0 38px; padding: 0; max-width: 620px; display: grid; gap: 12px; }
  .recap li {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 20px; background: #fff;
    border-left: 10px solid var(--paper); border-radius: 16px;
    box-shadow: 0 8px 18px rgba(46, 36, 83, .08);
  }
  .recap .t { font-size: 17px; font-weight: 500; }
  .recap .y { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

  /* ---------- 页脚 ---------- */
  .foot { flex-shrink: 0; padding: 4px 20px 32px; text-align: center; color: var(--dim); font-size: 14px; }
  .foot .pill {
    display: inline-flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 20px;
    border: 1.5px dashed rgba(46, 36, 83, .28); border-radius: 999px;
    background: rgba(255, 255, 255, .7);
  }

const movieTitle = it => LANG === 'it' ? it.titleIt : it.title;
const quoted     = it => T().q[0] + movieTitle(it) + T().q[1];

function setLang(l) {
  LANG = l;
  try { localStorage.setItem('quizLang', l); } catch (e) {}
  applyLang();
}

function applyLang() {
  const t = T();
  document.documentElement.lang = LANG === 'it' ? 'it' : 'zh-CN';
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  document.querySelectorAll('.tk-wrap').forEach(el => {
    const th = THEMES.find(x => x.id === el.dataset.id);
    el.querySelector('.nm').textContent = themeName(th);
    el.querySelector('.ct').textContent = t.count(th.movies.length);
    el.dataset.stamp = t.stamp;
  });
  $('qrOpen').setAttribute('aria-label', t.qrAria);
  $('qrOpen2').setAttribute('aria-label', t.qrAria);
  $('lockBtn').textContent = buzz.locked ? t.locked : t.unlocked;
  renderConsole();
  syncPick();
  if (!$('play').hidden) {
    renderFrames();
    $('still').alt = t.alt(state.idx + 1);
    renderMsg();
    if (!$('reveal').hidden) fillReveal();
  }
    if (!$('spinModal').hidden) renderSpin();
  if (!$('end').hidden) renderRecap();
}

/* ---------- 抢答器：Firebase 实时同步 ---------- */
const buzz = {
  ready: false, err: false, db: null, code: null,
  locked: true, round: 0, players: {}, buzzes: {},
  roomRef: null,
};

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function firebaseConfigured() {
  return FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'REPLACE_ME' && FIREBASE_CONFIG.databaseURL;
}

function initBuzzSystem() {
  if (!firebaseConfigured()) { buzz.err = true; renderConsole(); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    buzz.db = firebase.database();
  } catch (e) { buzz.err = true; renderConsole(); return; }
  let code = null;
  try { code = localStorage.getItem('buzzRoomCode'); } catch (e) {}
  openRoom(code || genRoomCode());
}

function openRoom(code) {
  if (buzz.roomRef) buzz.roomRef.off();
  buzz.code = code;
  buzz.players = {}; buzz.buzzes = {}; buzz.locked = true; buzz.round = 0;
  try { localStorage.setItem('buzzRoomCode', code); } catch (e) {}
  const ref = buzz.db.ref('rooms/' + code);
  buzz.roomRef = ref;
  ref.child('meta').set({ locked: true, round: 0, createdAt: firebase.database.ServerValue.TIMESTAMP });
  ref.on('value', snap => {
    const v = snap.val() || {};
    buzz.ready = true;
    buzz.locked = v.meta ? !!v.meta.locked : true;
    buzz.round  = v.meta ? (v.meta.round || 0) : 0;
    buzz.players = v.players || {};
    buzz.buzzes  = (v.buzzes && v.buzzes[buzz.round]) || {};
    renderConsole();
    renderBuzzChip();
  }, () => { buzz.err = true; renderConsole(); });
  renderConsole();
  renderBuzzChip();
}

function newRoom() {
  openRoom(genRoomCode());
}

function newRound() {
  if (!buzz.roomRef) return;
  buzz.roomRef.child('meta').update({ round: (buzz.round || 0) + 1, locked: false });
}

function toggleLock() {
  if (!buzz.roomRef) return;
  buzz.roomRef.child('meta').update({ locked: !buzz.locked });
}

function adjustScore(pid, delta) {
  if (!buzz.roomRef) return;
  buzz.roomRef.child('players/' + pid + '/score').transaction(v => (v || 0) + delta);
}

function removePlayer(pid) {
  if (!buzz.roomRef) return;
  buzz.roomRef.child('players/' + pid).remove();
}

function buzzUrl() {
  return BUZZ_PAGE_URL + '?room=' + (buzz.code || '');
}

function renderBuzzChip() {
  $('buzzCodeView').textContent = buzz.code || '----';
  drawQr($('qrOpen'), buzzUrl(), 82);
}

function renderQrStatus() {
  const t = T();
  const dot = $('consoleDot');
  dot.className = 'dot' + (buzz.err ? ' err' : buzz.ready ? ' live' : '');
  $('consoleStatusText').textContent = buzz.err ? t.statusErr : buzz.ready ? t.statusLive : t.statusConnecting;
  $('setupNote').hidden = !buzz.err;
  if (buzz.err) $('setupNote').innerHTML = t.setupNote;
}

function drawQr(container, text, size) {
  if (!window.QRCode || !container) return;
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  QRCode.toCanvas(canvas, text, { width: size, margin: 1, color: { dark: '#2E2453', light: '#ffffff' } }, () => {});
}

function renderConsole() {
  const t = T();
  renderQrStatus();
  $('consoleCode').textContent = buzz.code || '----';
  $('consoleUrl').textContent = buzz.code ? buzzUrl() : '';
  drawQr($('qrOpen2'), buzzUrl(), 108);
  $('lockBtn').textContent = buzz.locked ? t.locked : t.unlocked;

  // 抢答顺序
  const order = Object.entries(buzz.buzzes || {})
    .map(([pid, b]) => ({ pid, name: (buzz.players[pid] && buzz.players[pid].name) || b.name || '?', ts: b.ts || 0 }))
    .sort((a, b) => a.ts - b.ts);
  const ol = $('buzzOrderList');
  ol.innerHTML = '';
  order.forEach((o, i) => {
    const li = document.createElement('li');
    const first = order[0].ts;
    li.innerHTML = '<span class="rk">' + (i + 1) + '</span><span class="nm"></span><span class="tm">' +
      (i === 0 ? '' : '+' + ((o.ts - first) / 1000).toFixed(2) + 's') + '</span>';
    li.querySelector('.nm').textContent = o.name;
    ol.appendChild(li);
  });
  $('buzzOrderEmpty').hidden = order.length > 0;

  // 排行榜
  const players = Object.entries(buzz.players || {})
    .map(([pid, p]) => ({ pid, name: p.name || '?', score: p.score || 0 }))
    .sort((a, b) => b.score - a.score);
  const bl = $('boardList');
  bl.innerHTML = '';
  players.forEach(p => {
    const li = document.createElement('li');
    li.innerHTML =
      '<span class="nm"></span><span class="sc"></span>' +
      '<button class="mini" data-act="minus">−</button>' +
      '<button class="mini" data-act="plus">+</button>' +
      '<button class="rm" data-act="rm">✕</button>';
    li.querySelector('.nm').textContent = p.name;
    li.querySelector('.sc').textContent = p.score;
    li.querySelector('[data-act="plus"]').addEventListener('click', () => adjustScore(p.pid, 1));
    li.querySelector('[data-act="minus"]').addEventListener('click', () => adjustScore(p.pid, -1));
    li.querySelector('[data-act="rm"]').addEventListener('click', () => removePlayer(p.pid));
    bl.appendChild(li);
  });
  $('boardEmpty').hidden = players.length > 0;
}

function openConsole() { $('buzzConsole').hidden = false; renderConsole(); }
function closeConsole() { $('buzzConsole').hidden = true; }

/* ---------- 转盘：随机抽两个主题 ---------- */
const SPIN_MS = 4200;                       // 转多久（毫秒）
const spin = { stage: 0, picks: [], rot: 0, busy: false, token: 0 };
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const spinPool = () => THEMES.filter(t => !spin.picks.includes(t.id));   // 已抽到的不再出现

function drawWheel() {
  const pool = spinPool(), n = pool.length, step = 360 / n;
  const pt = (deg, r) => {
    const a = deg * Math.PI / 180;
    return [(r * Math.sin(a)).toFixed(2), (-r * Math.cos(a)).toFixed(2)];
  };
  let html = '';
  pool.forEach((t, i) => {
    const p1 = pt(i * step, 98), p2 = pt((i + 1) * step, 98);
    html += '<path d="M0 0L' + p1[0] + ' ' + p1[1] + 'A98 98 0 ' + (step > 180 ? 1 : 0) + ' 1 ' + p2[0] + ' ' + p2[1] +
            'Z" fill="' + t.color + '" stroke="#fff" stroke-width="2.5"/>' +
            '<text transform="rotate(' + ((i + .5) * step) + ') translate(0 -66)" text-anchor="middle" ' +
            'dominant-baseline="central" font-size="24">' + t.emoji + '</text>';
  });
  html += '<circle r="98" fill="none" stroke="#2E2453" stroke-width="4"/>';
  $('wheel').innerHTML = html;
}

function resetWheel() {
  const w = $('wheel');
  w.style.transition = 'none';
  w.style.transform = 'rotate(0deg)';
  spin.rot = 0;
  void w.offsetWidth;
  w.style.transition = '';
}

function renderSpin() {
  const t = T();
  $('spinTitle').textContent = t.spinTitle;
  $('spinClose').setAttribute('aria-label', t.close);
  const ul = $('spinRes');
  ul.innerHTML = '';
  for (let i = 0; i < PICKS; i++) {
    const th = THEMES.find(x => x.id === spin.picks[i]);
    const li = document.createElement('li');
    if (th) {
      li.className = 'got' + (i === spin.picks.length - 1 ? ' new' : '');
      li.style.setProperty('--paper', th.color);
      li.textContent = th.emoji + ' ' + themeName(th);
    } else {
      li.textContent = '?';
    }
    ul.appendChild(li);
  }
  $('spinGo').textContent = spin.stage >= PICKS ? t.spinStart : spin.stage === 0 ? t.spinGo : t.spinNext;
  $('spinGo').disabled = spin.busy;
  $('spinAgain').textContent = t.spinRedo;
  $('spinAgain').hidden = spin.stage < PICKS;
}

function doSpin() {
  if (spin.busy || spin.stage >= PICKS) return;
  const my = ++spin.token;
  const pool = spinPool(), n = pool.length, step = 360 / n;
  const k = Math.floor(Math.random() * n);                       // 抽中第 k 格
  const jitter = (Math.random() - .5) * step * .7;                // 在格子里随机停在偏左/偏右一点
  const target = ((-((k + .5) * step + jitter)) % 360 + 360) % 360;
  const final = Math.ceil(spin.rot / 360) * 360 + 360 * (4 + Math.floor(Math.random() * 2)) + target;
  const ms = reduceMotion() ? 0 : SPIN_MS;
  const w = $('wheel');
  spin.busy = true;
  renderSpin();
  w.style.transition = 'transform ' + ms + 'ms cubic-bezier(.12, .62, .08, 1)';
  spin.rot = final;
  w.style.transform = 'rotate(' + final + 'deg)';
  setTimeout(() => { if (my === spin.token) landed(pool[k]); }, ms + 80);
}

function landed(t) {
  spin.picks.push(t.id);
  spin.stage = spin.picks.length;
  renderSpin();
  if (spin.stage < PICKS) {
    const my = spin.token;                                        // 停一下，再把抽中的那格拿掉，准备下一轮
    setTimeout(() => {
      if (my !== spin.token) return;
      drawWheel(); resetWheel();
      spin.busy = false;
      renderSpin();
      $('spinGo').focus();
    }, 900);
  } else {
    spin.busy = false;
    state.picked = spin.picks.slice();                            // 同步到选主题页
    syncPick();
    renderSpin();
    $('spinGo').focus();
  }
}

function resetSpin() {
  spin.token++;
  spin.busy = false; spin.stage = 0; spin.picks = [];
  drawWheel(); resetWheel(); renderSpin();
}
function openSpin()  { resetSpin(); $('spinModal').hidden = false; $('spinGo').focus(); }
function closeSpin() { spin.token++; spin.busy = false; $('spinModal').hidden = true; }
/* ---------- 页脚 ---------- */
function renderFooter() {
  const box = $('contact');
  if (CONTACT_URL) {
    const a = document.createElement('a');
    a.href = CONTACT_URL; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = CONTACT_TEXT;
    box.appendChild(a);
  } else {
    const b = document.createElement('b');
    b.textContent = CONTACT_TEXT;
    box.appendChild(b);
  }
}

/* ---------- 选主题 ---------- */
function renderThemes() {
  const grid = $('themeGrid');
  THEMES.forEach(t => {
    const li = document.createElement('li');
    li.className = 'tk-wrap';
    li.dataset.id = t.id;
    li.style.setProperty('--paper', t.color);
    li.innerHTML =
      '<button type="button" class="tk" aria-pressed="false">' +
      '<span class="emo">' + t.emoji + '</span>' +
      '<span class="nm"></span>' +
      '<span class="ct"></span></button>';
    li.querySelector('button').addEventListener('click', () => toggleTheme(t.id));
    grid.appendChild(li);
  });
}

function toggleTheme(id) {
  const i = state.picked.indexOf(id);
  if (i > -1) {
    state.picked.splice(i, 1);
  } else {
    if (state.picked.length >= PICKS) state.picked.shift();   // 选第三个时，替换最早选的那个
    state.picked.push(id);
  }
  syncPick();
}

function syncPick() {
  const t = T();
  document.querySelectorAll('.tk-wrap').forEach(el => {
    const on = state.picked.includes(el.dataset.id);
    el.classList.toggle('on', on);
    el.querySelector('button').setAttribute('aria-pressed', on);
  });
  const names = state.picked.map(id => themeName(THEMES.find(x => x.id === id)));
  const left = PICKS - names.length;
  $('pickStatus').textContent =
    left === PICKS ? t.pickNone(PICKS) :
    left > 0 ? t.pickSome(names, left) :
    names.join(t.join);
  $('startBtn').disabled = left > 0;
}

/* ---------- 抽题 ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRound() {
  const seen = new Set();   // 同名电影（比如两个主题都有《哈利·波特与魔法石》）只留一部
  const pool = [];
  state.picked.forEach(id => {
    const t = THEMES.find(x => x.id === id);
    t.movies.forEach(([title, year, titleIt], k) => {
      if (seen.has(title)) return;
      seen.add(title);
      pool.push({ title, titleIt, year, theme: t, n: k + 1 });
    });
  });
  return shuffle(pool).slice(0, ROUNDS);
}

/* ---------- 图片加载（自动尝试多种扩展名） ---------- */
const imgCache = new Map();
const imagePath = (item, ext) =>
  IMAGE_DIR + '/' + item.theme.id + '/' + String(item.n).padStart(2, '0') + '.' + ext;

function tryLoad(url) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = url;
  });
}

function loadImage(item) {
  const key = item.theme.id + '/' + item.n;
  if (!imgCache.has(key)) {
    imgCache.set(key, (async () => {
      for (const ext of IMAGE_EXTS) {
        const u = imagePath(item, ext);
        if (await tryLoad(u)) return u;
      }
      return null;
    })());
  }
  return imgCache.get(key);
}

/* ---------- 游戏流程 ---------- */
function show(name) {
  ['pick', 'play', 'end'].forEach(n => { $(n).hidden = n !== name; });
  window.scrollTo(0, 0);
}

function startGame() {
  state.round = buildRound();
  state.idx = 0;
  state.token++;
  state.round.forEach(loadImage);   // 提前把 5 张都加载好
  show('play');
  showRound();
  $('nextBtn').focus();
}

function renderFrames() {
  const ol = $('frames');
  ol.innerHTML = '';
  state.round.forEach((_, i) => {
    const li = document.createElement('li');
    li.className = i < state.idx ? 'done' : i === state.idx ? 'now' : '';
    ol.appendChild(li);
  });
  $('counter').textContent = T().counter(state.idx + 1, state.round.length);
}

function renderMsg() {
  const el = $('stageMsg'), m = state.msg;
  if (!m) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = m.k === 'loading' ? T().loading : T().missing(m.p);
}

/* 出图前倒数：3、2、1 */
function countdown(token) {
  const box = $('count');
  return new Promise(resolve => {
    let n = COUNTDOWN;
    const tick = () => {
      if (token !== state.token) return resolve(false);   // 期间换题或退出了
      if (n <= 0) { box.hidden = true; return resolve(true); }
      box.innerHTML = '';
      const s = document.createElement('span');
      s.textContent = n;
      box.appendChild(s);
      box.hidden = false;
      n--;
      setTimeout(tick, 1000);
    };
    tick();
  });
}

async function showRound() {
  const item = state.round[state.idx];
  const token = ++state.token;
  const still = $('still'), bg = $('stageBg'), nextBtn = $('nextBtn');
  renderFrames();
  $('reveal').hidden = true;
  $('count').hidden = true;
  still.classList.remove('ready');
  bg.classList.remove('ready');
  still.removeAttribute('src');
  bg.style.backgroundImage = '';
  still.alt = T().alt(state.idx + 1);
  nextBtn.disabled = true;
  state.msg = null;
  renderMsg();

  const loading = loadImage(item);                 // 倒数的同时在后台加载图片
  if (COUNTDOWN > 0 && !(await countdown(token))) return;

  state.msg = { k: 'loading' };
  renderMsg();
  const url = await loading;
  if (token !== state.token) return;
  if (!url) {
    state.msg = { k: 'missing', p: imagePath(item, IMAGE_EXTS[0]) };
    renderMsg();
    nextBtn.disabled = false;
    return;
  }
  still.onload = () => {
    state.msg = null;
    renderMsg();
    still.classList.add('ready');
    bg.classList.add('ready');
    nextBtn.disabled = false;
    if (document.activeElement === document.body) nextBtn.focus();
  };
  bg.style.backgroundImage = 'url("' + url + '")';
  still.src = url;
}

/* 揭晓时撒一把小星星 */
function burst(color) {
  const wrap = $('ticketWrap');
  wrap.querySelectorAll('.spark').forEach(s => s.remove());
  const marks = ['✦', '✿', '★', '♥', '✧'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i');
    const a = Math.random() * Math.PI * 2;
    const d = 110 + Math.random() * 150;
    s.className = 'spark';
    s.textContent = marks[i % marks.length];
    s.style.color = i % 3 === 0 ? '#fff' : color;
    s.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
    s.style.setProperty('--dy', Math.round(Math.sin(a) * d * .7) + 'px');
    s.style.setProperty('--rot', Math.round(Math.random() * 300 - 150) + 'deg');
    wrap.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }
}

function fillReveal() {
  const it = state.round[state.idx];
  $('ticketWrap').style.setProperty('--paper', it.theme.color);
  $('revFrom').textContent = it.theme.emoji + ' ' + themeName(it.theme);
  $('revTitle').textContent = quoted(it);
  $('revYear').textContent = it.year;
  $('revNext').textContent = state.idx === state.round.length - 1 ? T().result : T().next;
}

function reveal() {
  const wrap = $('ticketWrap');
  fillReveal();
  wrap.style.animation = 'none';
  void wrap.offsetWidth;            // 让电影票每次都重新“打印”一遍
  wrap.style.animation = '';
  $('reveal').hidden = false;
  burst(state.round[state.idx].theme.color);
  $('revNext').focus();
}

function advance() {
  $('reveal').hidden = true;
  state.idx++;
  if (state.idx >= state.round.length) return showEnd();
  showRound();
  $('nextBtn').focus();
}

function renderRecap() {
  $('endSub').textContent = T().endSub(state.round.length);
  const ol = $('recap');
  ol.innerHTML = '';
  state.round.forEach(it => {
    const li = document.createElement('li');
    li.style.setProperty('--paper', it.theme.color);
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = it.theme.emoji + ' ' + quoted(it);
    const y = document.createElement('span');
    y.className = 'y';
    y.textContent = it.year;
    li.append(t, y);
    ol.appendChild(li);
  });
}

function showEnd() {
  state.token++;
  renderRecap();
  show('end');
  $('againBtn').focus();
}

function goHome() {
  state.token++;
  $('reveal').hidden = true;
  show('pick');
}

/* ---------- 事件 ---------- */
  $('spinBtn').addEventListener('click', openSpin);
$('spinGo').addEventListener('click', () => {
  if (spin.stage >= PICKS) { closeSpin(); startGame(); } else doSpin();
});
$('spinAgain').addEventListener('click', resetSpin);
$('spinClose').addEventListener('click', closeSpin);
$('spinModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeSpin(); });
$('qrOpen').addEventListener('click', openConsole);
$('qrOpen2').addEventListener('click', () => { if (navigator.clipboard) navigator.clipboard.writeText(buzzUrl()).catch(() => {}); });
$('consoleClose').addEventListener('click', closeConsole);
$('buzzConsole').addEventListener('click', e => { if (e.target === e.currentTarget) closeConsole(); });
$('newRoundBtn').addEventListener('click', newRound);
$('lockBtn').addEventListener('click', toggleLock);
$('newRoomBtn').addEventListener('click', newRoom);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('spinModal').hidden) closeSpin();
  if (!$('buzzConsole').hidden) closeConsole();
});
$('startBtn').addEventListener('click', startGame);
$('nextBtn').addEventListener('click', reveal);
$('revNext').addEventListener('click', advance);
$('quitBtn').addEventListener('click', goHome);
$('againBtn').addEventListener('click', startGame);
$('homeBtn').addEventListener('click', goHome);
document.querySelectorAll('.lang button').forEach(b =>
  b.addEventListener('click', () => setLang(b.dataset.lang)));

renderFooter();
renderThemes();
applyLang();
initBuzzSystem();
</script>
